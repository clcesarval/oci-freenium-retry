name: OCI Always Free Auto-Retry

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oci-retry
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Load OCI_ALL secret
        env:
          OCI_ALL: ${{ secrets.OCI_ALL }}
        run: |
          printf '%s\n' "$OCI_ALL" | tr -d '\r' | while IFS='=' read -r k v; do
            [ -z "$k" ] && continue
            echo "::add-mask::$v"
            if [ "$k" = "OCI_API_KEY_B64" ]; then
              {
                echo "OCI_API_KEY_CONTENT<<PEMEOF"
                echo "$v" | base64 -d
                echo "PEMEOF"
              } >> "$GITHUB_ENV"
            else
              echo "$k=$v" >> "$GITHUB_ENV"
            fi
          done

      - name: Run launch.py
        env:
          OCI_SHAPE: ${{ vars.OCI_SHAPE }}
          OCI_OCPUS: ${{ vars.OCI_OCPUS }}
          OCI_MEMORY_GB: ${{ vars.OCI_MEMORY_GB }}
          OCI_DISPLAY_NAME: ${{ vars.OCI_DISPLAY_NAME || 'trading-app' }}
          OCI_OS: ${{ vars.OCI_OS }}
          OCI_OS_VERSION: ${{ vars.OCI_OS_VERSION }}
          OCI_ARCH: ${{ vars.OCI_ARCH }}
          OCI_BOOT_VOLUME_SIZE_GB: ${{ vars.OCI_BOOT_VOLUME_SIZE_GB || '200' }}
        run: python scripts/launch.py

      - name: Commit state.json (if changed)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state.json
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "chore(state): update state.json"
            git pull --rebase origin main
            git push
          fi

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then EMOJI="✅"; else EMOJI="❌"; fi
          MESSAGE="${EMOJI} OCI Always Free Auto-Retry: ${JOB_STATUS}\n${RUN_URL}"
          curl --fail --silent --show-error --request POST \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
